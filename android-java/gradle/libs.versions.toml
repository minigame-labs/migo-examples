[versions]
agp = "8.7.3"
coreKtx = "1.15.0"
kotlin = "2.0.21"
# What the migo AAR uses at run time, which a file AAR brings none of: the versions migo-runtime's
# contracts/android-runtime-dependencies.json lists for the release the AAR is from.
migoKotlinStdlib = "2.4.21"
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "migoKotlinStdlib" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
