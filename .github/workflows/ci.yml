name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolver contract
        run: bash scripts/test-resolve-migo-artifact.sh

      - name: Release asset selection contract
        run: bash scripts/test-select-release-asset.sh

      - name: Attestation verification contract
        run: bash scripts/test-verify-attestation.sh

      - name: Content namespace contract
        run: bash scripts/test-content-namespace.sh

      - name: Resolve runtime
        id: resolve
        run: |
          set +e
          bash scripts/resolve-migo-artifact.sh android-aar android-java/libs/migo.aar
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # The resolver has one exit code (4) reserved specifically for "the
      # release or its asset is not available" -- see resolve-migo-artifact.sh,
      # where every default-mode failure past the version-file stage (missing
      # release, missing asset, failed download, missing attestation file) exits
      # 4. That is distinct from a broken resolver (a bad version-pin file: exit
      # 3, or a real integrity failure once bytes are in hand: exit 5), so exit 4
      # is the one and only condition this job treats as "skip, don't fail". A
      # migo runtime release is published as of v0.9.0, so resolution succeeds
      # (exit 0) and the Android build step below runs; the skip path stays in
      # place for whenever a future release temporarily lacks this asset.
      - name: Build Android example
        if: steps.resolve.outputs.status == '0'
        working-directory: android-java
        run: ./gradlew :app:assembleDebug :snippets:assembleDebug

      - name: Skip reason (no runtime release published)
        if: steps.resolve.outputs.status == '4'
        run: |
          echo "::notice::Android build skipped: resolve-migo-artifact.sh exited 4 (no migo runtime release is published yet). This is expected until the first release exists; see resolve-migo-artifact.sh for what exit 4 means."

      - name: Fail on resolver regression
        if: steps.resolve.outputs.status != '0' && steps.resolve.outputs.status != '4'
        run: |
          echo "::error::resolve-migo-artifact.sh exited ${{ steps.resolve.outputs.status }}, which is neither success (0) nor the documented no-release-available case (4). Treating this as a real resolver regression, not a skip."
          exit 1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev cmake xvfb libgl1 libegl1 libgl1-mesa-dri

      # The Linux example resolves the published SDK the same way run.sh does
      # on a developer machine -- see linux-cmake/run.sh, which calls
      # resolve-migo-artifact.sh linux-sdk. No local Migo checkout or Rust
      # toolchain is needed here; that path is for building the SDK itself,
      # which is migo's job, not this example's.
      - name: Build and run Linux example
        # Xvfb has no real GPU, so a DRI3 hardware-device lookup under it is a
        # race that sometimes loses ("Could not get DRI3 device" -> the render
        # thread never publishes GPU caps -> attach_surface fails -> segfault;
        # seen twice in this session alone). Forcing Mesa's llvmpipe software
        # rasterizer skips that lookup entirely instead of hoping it resolves.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a --server-args="-screen 0 720x1280x24" \
            bash linux-cmake/run.sh demo 8 2>&1 | tee /tmp/linux-example.log

          # The run must reach content-ready and exit cleanly. Grepping the log
          # rather than trusting the exit code alone: run.sh ends with `exec`,
          # so a host that started, failed to load content and still returned 0
          # would otherwise pass.
          grep -q "content is ready" /tmp/linux-example.log \
            || { echo "::error::the example never reported content ready"; exit 1; }
          grep -q "\[host\] done" /tmp/linux-example.log \
            || { echo "::error::the example did not shut down cleanly"; exit 1; }

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve runtime
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bash scripts/resolve-migo-artifact.sh windows-sdk windows-cmake/sdk
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # Same exit-code contract as the Android job's resolve step: 4 means
      # "no release published for this platform yet", anything else nonzero
      # is a real regression.
      - name: Skip reason (no runtime release published)
        if: steps.resolve.outputs.status == '4'
        shell: bash
        run: |
          echo "::notice::Windows build skipped: resolve-migo-artifact.sh exited 4 (no migo runtime release is published yet for windows-sdk)."

      - name: Fail on resolver regression
        if: steps.resolve.outputs.status != '0' && steps.resolve.outputs.status != '4'
        shell: bash
        run: |
          echo "::error::resolve-migo-artifact.sh exited ${{ steps.resolve.outputs.status }}, which is neither success (0) nor the documented no-release-available case (4). Treating this as a real resolver regression, not a skip."
          exit 1

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.resolve.outputs.status == '0'

      - name: Build Windows example
        if: steps.resolve.outputs.status == '0'
        shell: cmd
        run: |
          cmake -S windows-cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%CD%\windows-cmake\sdk"
          cmake --build build

      # Same fair-comparison bar as the Linux job: don't just build, actually
      # run it and grep the log for content-ready + clean shutdown. Stages
      # the demo content the same way windows-cmake/run.sh does for a
      # developer machine.
      - name: Run Windows example
        if: steps.resolve.outputs.status == '0'
        shell: bash
        run: |
          rm -rf windows-cmake/files
          mkdir -p windows-cmake/files/migo/games/demo/code
          cp games/demo/game.js games/demo/game.json windows-cmake/files/migo/games/demo/code/
          FILES_DIR_WIN="$(cygpath -w "$PWD/windows-cmake/files")"

          build/migo-windows-example.exe "$FILES_DIR_WIN" demo 8 2>&1 | tee /tmp/windows-example.log

          grep -q "content is ready" /tmp/windows-example.log \
            || { echo "::error::the example never reported content ready"; exit 1; }
          grep -q "\[host\] done" /tmp/windows-example.log \
            || { echo "::error::the example did not shut down cleanly"; exit 1; }
