name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolver contract
        run: bash scripts/test-resolve-migo-artifact.sh

      - name: Release asset selection contract
        run: bash scripts/test-select-release-asset.sh

      - name: Attestation verification contract
        run: bash scripts/test-verify-attestation.sh

      - name: Content namespace contract
        run: bash scripts/test-content-namespace.sh

      - name: Resolve runtime
        id: resolve
        run: |
          set +e
          bash scripts/resolve-migo-artifact.sh android-aar android-java/libs/migo.aar
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # The resolver has one exit code (4) reserved specifically for "the
      # release or its asset is not available" -- see resolve-migo-artifact.sh,
      # where every default-mode failure past the version-file stage (missing
      # release, missing asset, failed download, missing attestation file) exits
      # 4. That is distinct from a broken resolver (a bad version-pin file: exit
      # 3, or a real integrity failure once bytes are in hand: exit 5), so exit 4
      # is the one and only condition this job treats as "skip, don't fail".
      # No migo runtime release has been published yet, so today that is exactly
      # what happens. The moment a release exists, resolution starts succeeding
      # (exit 0) and the Android build step below begins running with no change
      # to this workflow.
      - name: Build Android example
        if: steps.resolve.outputs.status == '0'
        working-directory: android-java
        run: ./gradlew :app:assembleDebug :snippets:assembleDebug

      - name: Skip reason (no runtime release published)
        if: steps.resolve.outputs.status == '4'
        run: |
          echo "::notice::Android build skipped: resolve-migo-artifact.sh exited 4 (no migo runtime release is published yet). This is expected until the first release exists; see resolve-migo-artifact.sh for what exit 4 means."

      - name: Fail on resolver regression
        if: steps.resolve.outputs.status != '0' && steps.resolve.outputs.status != '4'
        run: |
          echo "::error::resolve-migo-artifact.sh exited ${{ steps.resolve.outputs.status }}, which is neither success (0) nor the documented no-release-available case (4). Treating this as a real resolver regression, not a skip."
          exit 1

      - name: Checkout Migo source
        uses: actions/checkout@v4
        with:
          repository: minigame-labs/migo
          path: migo-src

      - name: Install Rust and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev cmake xvfb libgl1 libegl1
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          source "$HOME/.cargo/env"

      - name: Fetch Linux sysroot
        working-directory: migo-src
        run: bash scripts/fetch-linux-sysroot.sh

      - name: Build Linux SDK from source
        working-directory: migo-src
        run: |
          source "$HOME/.cargo/env"
          bash scripts/build-linux-sdk.sh

      # The Linux example builds against a local SDK built from the current Migo source.
      # This avoids dependency on published releases which may have naming mismatches
      # in their attestation files.
      - name: Build and run Linux example
        env:
          MIGO_LOCAL_REPO: ${{ github.workspace }}/migo-src
        run: |
          xvfb-run -a --server-args="-screen 0 720x1280x24" \
            bash linux-cmake/run.sh demo 8 2>&1 | tee /tmp/linux-example.log

          # The run must reach content-ready and exit cleanly. Grepping the log
          # rather than trusting the exit code alone: run.sh ends with `exec`,
          # so a host that started, failed to load content and still returned 0
          # would otherwise pass.
          grep -q "content is ready" /tmp/linux-example.log \
            || { echo "::error::the example never reported content ready"; exit 1; }
          grep -q "\[host\] done" /tmp/linux-example.log \
            || { echo "::error::the example did not shut down cleanly"; exit 1; }
